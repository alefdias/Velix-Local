name: Build & Release Velix Local

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # BUILD LINUX DESKTOP
  # =============================================================
  build-linux:
    name: Build Linux Desktop (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Obter Dependências
        run: flutter pub get

      - name: Executar Testes Unitários
        run: flutter test

      - name: Compilar Linux Release
        run: flutter build linux --release

      - name: Empacotar Linux (.deb para Ubuntu, .rpm para Fedora, .tar.gz universal)
        run: |
          mkdir -p dist
          # 1. Empacotar TAR.GZ portátil universal
          tar -czvf dist/velix-local-linux-x64.tar.gz -C build/linux/x64/release/bundle .

          # 2. Preparar estrutura de instalação para DEB e RPM (/opt/velix-local)
          mkdir -p pkg_root/opt/velix-local
          cp -r build/linux/x64/release/bundle/* pkg_root/opt/velix-local/

          mkdir -p pkg_root/usr/bin
          cp packaging/linux/velix-local-bin pkg_root/usr/bin/velix-local
          chmod +x pkg_root/usr/bin/velix-local

          mkdir -p pkg_root/usr/share/applications
          cp packaging/linux/velix-local.desktop pkg_root/usr/share/applications/

          mkdir -p pkg_root/usr/share/icons/hicolor/256x256/apps
          cp packaging/linux/velix-local.png pkg_root/usr/share/icons/hicolor/256x256/apps/

          # 3. Gerar pacote DEB para Ubuntu / Debian
          mkdir -p pkg_deb/DEBIAN
          cp -r pkg_root/* pkg_deb/
          cp packaging/linux/control pkg_deb/DEBIAN/control
          dpkg-deb --build pkg_deb dist/velix-local-ubuntu-amd64.deb

          # 4. Gerar pacote RPM para Fedora / RHEL
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm
          fpm -s dir -t rpm \
            -n velix-local \
            -v 1.0.8 \
            -a x86_64 \
            --description "Velix Local - Sincronizacao P2P sem nuvem" \
            -m "Alef Dias <contato@velixlocal.org>" \
            -d "gtk3" \
            -p dist/velix-local-fedora-x86_64.rpm \
            -C pkg_root .

      - name: Upload Artefatos Linux (.deb, .rpm, .tar.gz)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: velix-local-linux-packages
          path: |
            dist/velix-local-ubuntu-amd64.deb
            dist/velix-local-fedora-x86_64.rpm
            dist/velix-local-linux-x64.tar.gz

  # =============================================================
  # BUILD WINDOWS DESKTOP
  # =============================================================
  build-windows:
    name: Build Windows Desktop (.exe / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Obter Dependências
        run: flutter pub get

      - name: Compilar Windows Release
        run: flutter build windows --release

      - name: Empacotar Binário Windows (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\velix-local-windows-x64.zip

      - name: Upload Artefato Windows
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: velix-local-windows-x64
          path: dist\velix-local-windows-x64.zip

  # =============================================================
  # BUILD ANDROID (.APK)
  # =============================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          channel: 'stable'
          cache: true

      - name: Aceitar Licenças do Android SDK
        run: yes | flutter doctor --android-licenses || true

      - name: Obter Dependências
        run: flutter pub get

      - name: Compilar Android APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Preparar APK para Download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/velix-local-android.apk

      - name: Upload Artefato Android
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: velix-local-android-apk
          path: dist/velix-local-android.apk

  # =============================================================
  # CRIAR RELEASE NO GITHUB (Se tag ou disparo manual na main)
  # =============================================================
  create-release:
    name: Publicar GitHub Release Oficial
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Baixar Artefatos Linux (.deb, .rpm, .tar.gz)
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: velix-local-linux-packages
          path: release-assets

      - name: Baixar Artefato Windows
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: velix-local-windows-x64
          path: release-assets

      - name: Baixar Artefato Android
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: velix-local-android-apk
          path: release-assets

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name || 'v1.0.8' }}
          name: Velix Local ${{ github.ref_name || 'v1.0.8' }}
          draft: false
          prerelease: false
          body: |
            ## Velix Local — Sincronize sem nuvem ⚡

            Software de sincronização e transferência inteligente peer-to-peer (P2P) entre dispositivos na mesma rede local, 100% offline, sem nuvem e sem servidor externo.

            ### 📦 Binários Oficiais Disponíveis:
            * 🎩 **Fedora / RHEL / CentOS:** `velix-local-fedora-x86_64.rpm` (Instalação nativa via DNF ou clique duplo)
            * 🐧 **Ubuntu / Debian / Mint:** `velix-local-ubuntu-amd64.deb` (Instalação nativa via APT ou clique duplo)
            * 📦 **Linux Universal:** `velix-local-linux-x64.tar.gz` (Executável portátil para qualquer distro)
            * 🪟 **Windows:** `velix-local-windows-x64.zip` (Executável .exe portátil)
            * 🤖 **Android:** `velix-local-android.apk` (Instalador universal Android)
