name: Build & Release Velix Local

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =============================================================
  # BUILD LINUX DESKTOP
  # =============================================================
  build-linux:
    name: Build Linux Desktop (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obter Dependências
        run: flutter pub get

      - name: Executar Testes Unitários
        run: flutter test

      - name: Compilar Linux Release
        run: flutter build linux --release

      - name: Empacotar Binário Linux
        run: |
          mkdir -p dist
          tar -czvf dist/velix-local-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: velix-local-linux-x64
          path: dist/velix-local-linux-x64.tar.gz

  # =============================================================
  # BUILD WINDOWS DESKTOP
  # =============================================================
  build-windows:
    name: Build Windows Desktop (.exe / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obter Dependências
        run: flutter pub get

      - name: Compilar Windows Release
        run: flutter build windows --release

      - name: Empacotar Binário Windows (.zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\velix-local-windows-x64.zip

      - name: Upload Artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: velix-local-windows-x64
          path: dist\velix-local-windows-x64.zip

  # =============================================================
  # BUILD ANDROID (.APK)
  # =============================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Aceitar Licenças do Android SDK
        run: yes | flutter doctor --android-licenses || true

      - name: Obter Dependências
        run: flutter pub get

      - name: Compilar Android APK Release
        run: flutter build apk --release

      - name: Preparar APK para Download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/velix-local-android.apk

      - name: Upload Artefato Android
        uses: actions/upload-artifact@v4
        with:
          name: velix-local-android-apk
          path: dist/velix-local-android.apk

  # =============================================================
  # CRIAR RELEASE NO GITHUB (Se tag ou disparo manual na main)
  # =============================================================
  create-release:
    name: Publicar GitHub Release Oficial
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Baixar Artefato Linux
        uses: actions/download-artifact@v4
        with:
          name: velix-local-linux-x64
          path: release-assets

      - name: Baixar Artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: velix-local-windows-x64
          path: release-assets

      - name: Baixar Artefato Android
        uses: actions/download-artifact@v4
        with:
          name: velix-local-android-apk
          path: release-assets

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: Velix Local ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## Velix Local — Sincronize sem nuvem ⚡

            Software de sincronização e transferência inteligente peer-to-peer (P2P) entre dispositivos na mesma rede local, 100% offline, sem nuvem e sem servidor externo.

            ### 📦 Binários Oficiais Disponíveis:
            * **Windows:** `velix-local-windows-x64.zip` (Executável .exe portátil)
            * **Linux:** `velix-local-linux-x64.tar.gz` (Binário nativo para Linux x64)
            * **Android:** `velix-local-android.apk` (Instalador universal Android)

            ### ✨ Recursos Inclusos:
            - **Velix Sync:** Sincronização contínua e bidirecional de pastas locais.
            - **Retomada de Transferência (Chunking):** Continua do bloco seguinte sem reiniciar do zero.
            - **Descoberta Automática:** mDNS e varredura ativa de sub-rede corporativa.
            - **Identificação Corporativa:** Renomeação personalizada de computadores da empresa.
            - **Banco de Dados SQLite:** Dispositivos confiáveis e histórico completo com busca.
